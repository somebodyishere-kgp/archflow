name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/**"]

jobs:
  package-desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          echo "# Desktop Build Report" > artifacts/build-report.md
          echo "desktop-runtime shell and rendering overlays validated" >> artifacts/build-report.md
      - name: Validate desktop runtime shell structure
        run: |
          test -f desktop-runtime/main.ts
          test -f desktop-runtime/preload.ts
          test -f desktop-runtime/window-manager.ts
          test -f desktop-runtime/runtime-bridge.ts
          test -f desktop-runtime/app-shell/Sidebar.tsx
          test -f desktop-runtime/app-shell/SystemsPanel.tsx
          test -f desktop-runtime/app-shell/FeedbackPanel.tsx
          test -f desktop-runtime/app-shell/IntentInputBar.tsx
          test -f desktop-runtime/app-shell/CADViewport.tsx
          test -f desktop-runtime/app-shell/ToolPalette.tsx
          test -f desktop-runtime/app-shell/LayerManager.tsx
          test -f desktop-runtime/app-shell/ParametricInspector.tsx
          test -f desktop-runtime/app-shell/NaturalLanguageInput.tsx
          test -f desktop-runtime/app-shell/ParametricEditor.tsx
          test -f desktop-runtime/app-shell/AssemblyInspector.tsx
          test -f desktop-runtime/app-shell/PlanView.tsx
          test -f desktop-runtime/app-shell/SectionView.tsx
          test -f desktop-runtime/app-shell/CoDesignPanel.tsx
          test -f desktop-runtime/app-shell/SuggestionTimeline.tsx
          test -f desktop-runtime/app-shell/RealtimeIntentBar.tsx
          test -f desktop-runtime/app-shell/SpatialCognitionPanel.tsx
          test -f desktop-runtime/app-shell/ExperienceHeatmap.tsx
          test -f desktop-runtime/app-shell/MovementGraphView.ts
      - name: Validate MU rendering overlays
        run: |
          test -f rendering-client/src/mu/HumanIntentOverlay.tsx
          test -f rendering-client/src/mu/ExplanationPanel.ts
          test -f rendering-client/src/mu/CognitiveFlowVisualizer.ts
      - name: Validate XI rendering overlays
        run: |
          test -f rendering-client/src/xi/GeneratedGeometryRenderer.ts
          test -f rendering-client/src/xi/PlanOverlay.tsx
          test -f rendering-client/src/xi/SectionOverlay.tsx
      - name: Validate XII rendering overlays
        run: |
          test -f rendering-client/src/xii/GenerativeSuggestionOverlay.tsx
          test -f rendering-client/src/xii/ReasoningTracePanel.ts
          test -f rendering-client/src/xii/IntentEvolutionView.ts
      - name: Validate XI++ rendering overlays
        run: |
          test -f rendering-client/src/xipp/AssemblyRenderer.ts
          test -f rendering-client/src/xipp/GridOverlay.tsx
          test -f rendering-client/src/xipp/ParametricHighlight.ts
      - name: Validate XIII rendering overlays
        run: |
          test -f rendering-client/src/xiii/RealtimeSuggestionOverlay.tsx
          test -f rendering-client/src/xiii/AdaptiveIntentVisualizer.ts
          test -f rendering-client/src/xiii/DesignDeltaRenderer.ts
      - name: Validate XIV rendering overlays
        run: |
          test -f rendering-client/src/xiv/SpatialPerceptionOverlay.tsx
          test -f rendering-client/src/xiv/FlowVisualization.ts
          test -f rendering-client/src/xiv/VisualFocusMap.ts
      - name: Enforce read-only desktop and rendering boundaries
        run: |
          if rg -n "/twingraph/ingest|INSERT INTO twingraph_nodes|UPDATE twingraph_nodes|method:\\s*['\"](POST|PUT|PATCH|DELETE)['\"]" desktop-runtime rendering-client/src/mu rendering-client/src/xi rendering-client/src/xii rendering-client/src/xipp rendering-client/src/xiii rendering-client/src/xiv; then
            echo "Desktop runtime and MU overlays must remain read-only."
            exit 1
          fi
      - name: Emit MU desktop artifacts
        run: |
          echo "# MU Desktop Runtime Report" > artifacts/mu-human-interface-report.md
          echo "desktop shell validated as deterministic interaction bridge" >> artifacts/mu-human-interface-report.md
          echo "{\"intent_flow\":\"ready\"}" > artifacts/intent-flow-trace.json
          echo "{\"feedback_graph\":[]}" > artifacts/feedback-graph.json
          echo "{\"cognitive_state\":[]}" > artifacts/cognitive-state-dump.json
          echo "# XI Desktop Synthesis Report" > artifacts/xi-synthesis-report.md
          echo "desktop CAD shell and synthesis overlays validated as read-only consumers" >> artifacts/xi-synthesis-report.md
          echo "{\"geometry\":[]}" > artifacts/generated-geometry.json
          echo "{\"plan\":[]}" > artifacts/plan-output.json
          echo "{\"section\":[]}" > artifacts/section-output.json
          echo "# XII Generative Report" > artifacts/xii-generative-report.md
          echo "xii overlays validated as read-only reasoning visualizers" >> artifacts/xii-generative-report.md
          echo "{\"reasoning\":[]}" > artifacts/llm-reasoning-trace.json
          echo "{\"intent\":\"validated\"}" > artifacts/validated-intent.json
          echo "{\"strategy\":\"deterministic\"}" > artifacts/design-strategy-output.json
          echo "# XI++ Geometry Report" > artifacts/xipp-geometry-report.md
          echo "{\"assemblies\":[]}" > artifacts/assembly-output.json
          echo "{\"plan_metrics\":{\"units\":\"mm\"}}" > artifacts/plan-metrics.json
          echo "{\"grid\":{\"status\":\"ready\"}}" > artifacts/structural-grid.json
          echo "# XIII CoDesign Report" > artifacts/xiii-codesign-report.md
          echo "{\"suggestions\":[]}" > artifacts/realtime-suggestion-trace.json
          echo "{\"revision\":0}" > artifacts/codesign-runtime-state.json
          echo "{\"history\":[]}" > artifacts/delta-context-history.json
          echo "# XIV Spatial Cognition Report" > artifacts/xiv-spatial-cognition-report.md
          echo "{\"nodes\":[],\"edges\":[]}" > artifacts/movement-graph.json
          echo "{\"cones\":[]}" > artifacts/visual-field-map.json
          echo "{\"atmosphere\":0}" > artifacts/experience-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-artifacts
          path: artifacts/
