openapi: 3.1.0
info:
  title: MEP Agent API
  version: 0.1.0
servers:
  - url: http://mep-agent:8000
paths:
  /health:
    get:
      responses:
        "200":
          description: Service status
  /v1/mep/route:
    post:
      summary: Deterministic routing and clash check request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "501":
          description: BLOCKED - deterministic routing engine integration pending
