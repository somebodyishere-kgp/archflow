openapi: 3.1.0
info:
  title: Regulation Agent API
  version: 0.1.0
servers:
  - url: http://regulation-agent:8000
paths:
  /health:
    get:
      summary: Health endpoint
      responses:
        "200":
          description: Service status
  /v1/compliance/check:
    post:
      summary: Deterministic compliance check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "501":
          description: BLOCKED - deterministic rule engine not integrated
