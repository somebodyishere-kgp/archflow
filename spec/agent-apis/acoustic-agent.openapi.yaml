openapi: 3.1.0
info:
  title: Acoustic Agent API
  version: 0.1.0
servers:
  - url: http://acoustic-agent:8000
paths:
  /health:
    get:
      responses:
        "200":
          description: Service status
  /v1/acoustic/analyze:
    post:
      summary: Deterministic acoustic analysis request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "501":
          description: BLOCKED - acoustic simulation container integration pending
