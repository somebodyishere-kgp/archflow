openapi: 3.1.0
info:
  title: Documentation Agent API
  version: 0.1.0
servers:
  - url: http://documentation-agent:8000
paths:
  /health:
    get:
      responses:
        "200":
          description: Service status
  /v1/docs/render:
    post:
      summary: Render TwinGraph query to PDF/SVG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "501":
          description: BLOCKED - deterministic query renderer not yet integrated
