name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/**"]

jobs:
  package-desktop:
    runs-on: ubuntu-22.04
    container: node:20.18.1-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          echo "# Render Build Report" > artifacts/render-build-report.md
          echo "desktop-build executing rendering-client read-only contract checks" >> artifacts/render-build-report.md
      - name: Install rendering-client dependencies
        run: |
          cd rendering-client
          npm install
      - name: Build rendering-client
        run: |
          cd rendering-client
          npm run build | tee ../artifacts/view-schema-validation.log
      - name: Test rendering-client view adapter contract
        run: |
          cd rendering-client
          npm run test | tee -a ../artifacts/view-schema-validation.log
      - name: Enforce read-only rendering guardrails
        run: |
          if rg -n "method:\\s*['\"](POST|PUT|PATCH|DELETE)['\"]|/twingraph/ingest|/twingraph/query|/twingraph/view/section" rendering-client/src; then
            echo "Rendering client must remain read-only."
            exit 1
          fi
          echo "Read-only guardrails passed." >> artifacts/render-build-report.md
      - name: Enforce kernel sync usage
        run: |
          test -f rendering-client/src/runtime/RuntimeSyncEngine.ts
          test -f rendering-client/src/runtime/RuntimeKernelAdapter.ts
          rg -n "render.sync|runtime_cycle_id" rendering-client/src/runtime > artifacts/runtime-event-trace.json
          test -f rendering-client/src/intelligence/IntelligenceOverlay.tsx
          test -f rendering-client/src/evolution/EvolutionOverlay.tsx
          test -f rendering-client/src/urban/UrbanOverlayEngine.ts
          test -f rendering-client/src/systems/SystemsViewportManager.ts
          test -f rendering-client/src/systems/GenericTopologyRenderer.ts
      - name: Emit runtime integration report
        run: |
          echo "# Runtime Integration Report" > artifacts/runtime-integration-report.md
          echo "rendering runtime sync wired to deterministic kernel events" >> artifacts/runtime-integration-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-artifacts
          path: artifacts/
