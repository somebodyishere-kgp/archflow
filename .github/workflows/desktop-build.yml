name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/**"]

jobs:
  package-desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          echo "# Build Report" > artifacts/build-report.md
          echo "desktop-build executed (skeleton)" >> artifacts/build-report.md
          echo "{\"desktop_packaging\":\"blocked\"}" > artifacts/event-audit.json
          echo "tauri packaging not yet implemented in Sprint 0" > artifacts/schema-validation.log
      - name: Fail until Tauri packaging is fully wired
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-artifacts
          path: artifacts/
